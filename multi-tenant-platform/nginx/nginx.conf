events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Upstream for portal frontend
    upstream portal_frontend {
        server portal-frontend:80;
    }

    # Upstream for portal backend
    upstream portal_backend {
        server portal-backend:3001;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Increase body size for file uploads
        client_max_body_size 50M;

        # Portal frontend (root)
        location / {
            proxy_pass http://portal_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Portal backend API
        location /api/ {
            proxy_pass http://portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Increase timeouts for long-running operations
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # n8n instances (user-*.n8n.localhost)
    server {
        listen 80;
        server_name ~^user-(?<user_id>[^.]+)\.n8n\.localhost$;

        # Increase body size for n8n file uploads
        client_max_body_size 50M;

        location / {
            # Resolve the container name dynamically
            resolver 127.0.0.11 valid=30s;
            set $n8n_backend n8n-user-$user_id:5678;

            proxy_pass http://$n8n_backend;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Increase timeouts for long-running workflows
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }
    }
}
